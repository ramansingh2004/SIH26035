[project]
name = "sih26035-backend"
version = "0.1.0"
description = "Phase 0 bootstrap for the SIH26035 laboratory platform"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2026.4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests", "domain_tests"]
pythonpath = ["."]
addopts = "-ra"
