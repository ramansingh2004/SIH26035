  "checklist": [
    {
      "key": "DIRECT_SALES_AUTOMATIC_FUNCTIONS",
      "group": "DIRECT_SALES",
      "text": "For direct-sales instruments, confirm that prohibited combined or automatic zero/tare functions are not provided and that the applicable restrictions on automatic functions are enforced.",
      "source": {
        "part": "R76-1",
        "edition": "2006",
        "identity": "OIML R 76-1:2006 (E) — Non-automatic weighing instruments — Part 1: Metrological and technical requirements - Tests",
        "clause": "4.5.4; 4.13.3.3",
        "digest": "06d9674f4f557ea053482960472db560aaedcc7665e6dabb4b4012333f3e068b"
      },
      "applicability": {
        "schema_version": "v2",
        "cases": [
          {
            "when": {
              "kind": "boolean",
              "feature": "is_direct_sales",
              "expected": true
            },
            "decision": "REQUIRED",
            "reason": "Direct-sales automatic-function restrictions applies because the instrument is for direct sales to the public."
          },
          {
            "when": {
              "kind": "boolean",
              "feature": "is_direct_sales",
              "expected": false
            },
            "decision": "NOT_APPLICABLE",
            "reason": "Direct-sales automatic-function restrictions is not applicable because the instrument is not for direct sales to the public."
          }
        ]
      },
      "evidence_required": true,
      "verification": {
        "status": "VERIFIED",
        "verified_by": "Dr. Y.G prajapati",
        "verified_at": "2026-09-29T00:46:16+05:30",
        "evidence": "CHECKLIST-REVIEW:DIRECT_SALES_AUTOMATIC_FUNCTIONS"
      }
    },
