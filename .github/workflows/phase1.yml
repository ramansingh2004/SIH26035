name: Phase 1 verification
on:
  push:
    branches: [feature/phase-1-foundations]
  pull_request:
    paths: ["backend/**", ".github/workflows/phase1.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase1
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: sih26035_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phase1 -d sih26035_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://phase1:ephemeral-ci-only@127.0.0.1:5432/sih26035_dev
      TEST_DATABASE_URL: postgresql+asyncpg://phase1:ephemeral-ci-only@127.0.0.1:5432/sih26035_test
      PGPASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.15
      - run: uv sync --locked
      - name: Create isolated test database
        run: createdb -h 127.0.0.1 -U phase1 sih26035_test
      - name: Migrate development PostgreSQL
        run: uv run alembic upgrade head
      - name: Verify migration and metadata
        run: |
          uv run alembic current
          uv run alembic check
      - name: Seed permission catalog
        run: uv run python -m app.cli seed
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Complete Phase 1 tests
        run: uv run pytest -ra
      - name: Real backend HTTP flows and development schema
        run: uv run python -m scripts.verify_phase1
      - name: Migration rollback and clean re-upgrade on isolated test database
        env:
          DATABASE_URL: postgresql+asyncpg://phase1:ephemeral-ci-only@127.0.0.1:5432/sih26035_test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

